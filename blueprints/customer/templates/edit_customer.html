{% extends "base.html" %}
{% block title %}Edit Customer{% endblock %}
{% block content %}
<form method="POST" class="max-w-md mx-auto mt-6 bg-white dark:bg-gray-800 p-6 rounded shadow-md">
  <h2 class="text-xl font-bold mb-4 text-gray-900 dark:text-gray-100">Edit Customer</h2>
  
  <label class="block mb-2 text-gray-900 dark:text-gray-100">Name
    <input type="text" name="name" value="{{ customer.name }}" 
           class="w-full border border-gray-300 dark:border-gray-600 p-2 rounded bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
  </label>
  
  <label class="block mb-2 text-gray-900 dark:text-gray-100">Email
    <input type="email" name="email" value="{{ customer.email }}" 
           class="w-full border border-gray-300 dark:border-gray-600 p-2 rounded bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
  </label>
  
  <label class="block mb-4 text-gray-900 dark:text-gray-100">Phone
    <input type="text" name="phone" value="{{ customer.phone }}" 
           class="w-full border border-gray-300 dark:border-gray-600 p-2 rounded bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
  </label>
  
  <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition">
    Save
  </button>
  <a href="/customers_page" class="ml-2 text-blue-600 dark:text-blue-400 hover:underline">
    Cancel
  </a>
</form>
{% endblock %}
